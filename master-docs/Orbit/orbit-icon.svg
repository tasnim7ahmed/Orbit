<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <!-- Orbit app icon — same artwork as the Android adaptive icon (res/drawable/ic_launcher_*) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="0.55" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#64D2FF"/>
    </linearGradient>
    <radialGradient id="gloss" cx="30" cy="18" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="44" y1="35" x2="64" y2="73" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3634A3"/>
      <stop offset="1" stop-color="#0A6FD6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="squircle">
      <rect width="108" height="108" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="url(#bg)"/>
    <rect width="108" height="108" fill="url(#gloss)"/>

    <!-- Glyph (scaled up for the rounded-square version; the Android icon keeps the safe-zone margin) -->
    <g transform="translate(54 54) scale(1.18) translate(-54 -54)">
    <!-- Ring, back half -->
    <g transform="rotate(-25 54 54)">
      <path d="M23,54 A31,11.5 0 1,1 85,54" fill="none" stroke="#FFFFFF" stroke-opacity="0.55"
            stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Phone (with soft shadow) -->
    <rect x="41" y="33.6" width="26" height="44" rx="7" fill="#0B1A4A" fill-opacity="0.28" filter="url(#soft)"/>
    <rect x="41" y="32" width="26" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="43.5" y="34.8" width="21" height="38.4" rx="5" fill="url(#screen)"/>
    <rect x="50" y="37.2" width="8" height="2.6" rx="1.3" fill="#0B0B1A"/>

    <!-- Ring, front half + watch -->
    <g transform="rotate(-25 54 54)">
      <path d="M23,54 A31,11.5 0 0,0 85,54" fill="none" stroke="#FFFFFF"
            stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="79.4" cy="60.6" r="6" fill="#FFFFFF"/>
      <circle cx="79.4" cy="60.6" r="3.6" fill="#0A84FF"/>
    </g>
    </g>
  </g>
</svg>
